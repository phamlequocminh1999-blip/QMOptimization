<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QMinhOTM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#22c55e', accent: '#00f0ff', neon: '#7000ff' },
                        darkbg: '#0a0d14', cardbg: '#111622', bordercolor: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-brand-500 selection:text-black">
    <!-- Background Glow -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-neon/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-brand-accent/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="bg-cardbg/80 backdrop-blur-xl border border-bordercolor p-8 rounded-2xl shadow-2xl w-full max-w-md z-10">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-brand-neon to-brand-accent flex items-center justify-center font-extrabold text-3xl text-white shadow-lg mb-4">Q</div>
            <h1 class="text-2xl font-bold text-white">QMinhOTM</h1>
            <p class="text-sm text-slate-400">Hệ thống tối ưu hóa PC & Laptop</p>
        </div>

        <!-- Toggle Login/Register -->
        <div class="flex bg-slate-900 rounded-lg p-1 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-md bg-brand-500 text-black transition-all">Đăng Nhập</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition-all">Đăng Ký</button>
        </div>

        <!-- Forms -->
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="nameField" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Họ và Tên</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="fullname" class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:border-brand-accent transition" placeholder="Ví dụ: Quốc Minh">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email hoặc Tên tài khoản</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:border-brand-accent transition" placeholder="admin@qminh.com">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Mật khẩu</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:border-brand-accent transition" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-black font-bold py-3 rounded-lg mt-4 transition glow-button">
                Đăng Nhập Hệ Thống
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-brand-accent transition"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang chủ (Khách)</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
